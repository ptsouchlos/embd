name: CRAP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: crap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crap:
    uses: ptsouchlos/infra/.github/workflows/rust-crap.yml@v1
    with:
      lfs: true
