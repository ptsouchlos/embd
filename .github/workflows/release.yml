name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}" # strip prerelease suffix, e.g. 0.1.0-rc.1 -> 0.1.0
          crate="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag}) does not match Cargo.toml version ${crate}. Bump Cargo.toml before tagging." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so shadow-rs builds correct version metadata
      - uses: ptsouchlos/infra/.github/actions/setup-rust@v1
        with:
          components: ""
          targets: ${{ matrix.target }}
      - uses: ptsouchlos/infra/.github/actions/cargo-release@v1
        with:
          target: ${{ matrix.target }}
          bin: embd
          release: "true"

  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # shadow-rs reads git metadata at build time
      - name: Set up Rust
        run: rustup default stable
      # If the verify build fails because the packaged tarball has no .git for
      # shadow-rs, add `--no-verify` (the build job above already validates a real build).
      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tag-major:
    name: Move major tag
    needs: build
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Repoint major tag to this release
        shell: bash
        run: |
          major="${GITHUB_REF_NAME%%.*}" # v0.1.0 -> v0
          git tag -f "$major" # points at the checked-out tag commit (HEAD)
          git push -f origin "$major"
