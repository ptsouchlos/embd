name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compare tag and crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}" # strip prerelease suffix, e.g. 0.1.0-rc.1 -> 0.1.0
          crate="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag}) does not match Cargo.toml version ${crate}. Bump Cargo.toml before tagging." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history + tags so shadow-rs builds correct version metadata
      - uses: ptsouchlos/infra/.github/actions/setup-rust@v1.8.0
        with:
          components: ""
          targets: ${{ matrix.target }}
      - uses: ptsouchlos/infra/.github/actions/cargo-release@v1.8.0
        with:
          target: ${{ matrix.target }}
          bin: embd
      - name: Upload release artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--generate-notes --verify-tag)
            if [ "$IS_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi

  build-wheels:
    name: Build wheel (${{ matrix.target }}${{ matrix.manylinux && format(' {0}', matrix.manylinux) || '' }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            manylinux: "2_28"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            manylinux: "2_28"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            manylinux: musllinux_1_2
          - target: aarch64-apple-darwin
            runner: macos-26
            manylinux: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            manylinux: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history + tags so shadow-rs builds correct version metadata
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, build-wheels]
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-pre-commit:
    name: Notify embd-pre-commit
    needs: publish-pypi
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch release to embd-pre-commit
        env:
          GH_TOKEN: ${{ secrets.PRE_COMMIT_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          gh api repos/ptsouchlos/embd-pre-commit/dispatches \
            -f event_type=embd-release \
            -f "client_payload[version]=${version}"

  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # shadow-rs reads git metadata at build time
      - name: Set up Rust
        run: rustup default stable
      # If the verify build fails because the packaged tarball has no .git for
      # shadow-rs, add `--no-verify` (the build job above already validates a real build).
      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tag-major:
    name: Move major tag
    needs: build
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Repoint major tag to this release
        shell: bash
        run: |
          major="${GITHUB_REF_NAME%%.*}" # v0.1.0 -> v0
          git tag -f "$major" # points at the checked-out tag commit (HEAD)
          git push -f origin "$major"

  publish-homebrew:
    name: Publish to Homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7.0.1
        with:
          repository: ptsouchlos/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Formula/embd.rb
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import textwrap

          version = os.environ["VERSION"].lstrip("v")
          assets = pathlib.Path("release-assets")

          def read_sha(name: str) -> str:
              return (assets / f"{name}.sha256").read_text().split()[0]

          macos_arm_sha = read_sha("embd-aarch64-apple-darwin.tar.gz")
          linux_arm_sha = read_sha("embd-aarch64-unknown-linux-musl.tar.gz")
          linux_x64_sha = read_sha("embd-x86_64-unknown-linux-musl.tar.gz")

          formula = textwrap.dedent(f"""\
              class Embd < Formula
                desc "CLI tool for embedding a git repo into another"
                homepage "https://github.com/ptsouchlos/embd"
                version "{version}"
                license "MIT"

                on_macos do
                  on_arm do
                    url "https://github.com/ptsouchlos/embd/releases/download/v#{{version}}/embd-aarch64-apple-darwin.tar.gz"
                    sha256 "{macos_arm_sha}"
                  end
                end

                on_linux do
                  on_arm do
                    url "https://github.com/ptsouchlos/embd/releases/download/v#{{version}}/embd-aarch64-unknown-linux-musl.tar.gz"
                    sha256 "{linux_arm_sha}"
                  end

                  on_intel do
                    url "https://github.com/ptsouchlos/embd/releases/download/v#{{version}}/embd-x86_64-unknown-linux-musl.tar.gz"
                    sha256 "{linux_x64_sha}"
                  end
                end

                def install
                  bin.install "embd"
                end

                test do
                  assert_match version.to_s, shell_output("#{{bin}}/embd --version")
                end
              end
          """)

          out = pathlib.Path("homebrew-tap/Formula/embd.rb")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(formula)
          PY
      - name: Commit and push formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/embd.rb
          if git diff --cached --quiet; then
            echo "Formula/embd.rb is already up to date."
            exit 0
          fi
          git commit -m "embd ${VERSION#v}"
          git push

  publish-winget:
    name: Publish to Winget
    needs: release
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - name: Submit update to microsoft/winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ptsouchlos.embd
          installers-regex: 'embd-x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
