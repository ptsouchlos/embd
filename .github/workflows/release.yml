name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}" # strip prerelease suffix, e.g. 0.1.0-rc.1 -> 0.1.0
          crate="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag}) does not match Cargo.toml version ${crate}. Bump Cargo.toml before tagging." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            archive: tar.gz
            musl: true
          - target: aarch64-apple-darwin
            runner: macos-26
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so shadow-rs builds correct version metadata
      - name: Set up Rust
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C target/${{ matrix.target }}/release -czf embd-${{ matrix.target }}.tar.gz embd
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a "${GITHUB_WORKSPACE}/embd-${{ matrix.target }}.zip" embd.exe
      - name: Checksum
        shell: bash
        run: sha256sum "embd-${{ matrix.target }}.${{ matrix.archive }}" > "embd-${{ matrix.target }}.${{ matrix.archive }}.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: embd-${{ matrix.target }}.*
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-wheels:
    name: Build wheel (${{ matrix.target }}${{ matrix.manylinux && format(' {0}', matrix.manylinux) || '' }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            manylinux: "2_28"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            manylinux: "2_28"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            manylinux: musllinux_1_2
          - target: aarch64-apple-darwin
            runner: macos-26
            manylinux: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            manylinux: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so shadow-rs builds correct version metadata
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, build-wheels]
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-pre-commit:
    name: Notify embd-pre-commit
    needs: publish-pypi
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch release to embd-pre-commit
        env:
          GH_TOKEN: ${{ secrets.PRE_COMMIT_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          gh api repos/ptsouchlos/embd-pre-commit/dispatches \
            -f event_type=embd-release \
            -f "client_payload[version]=${version}"

  publish-crate:
    name: Publish to crates.io
    needs: check-version
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # shadow-rs reads git metadata at build time
      - name: Set up Rust
        run: rustup default stable
      # If the verify build fails because the packaged tarball has no .git for
      # shadow-rs, add `--no-verify` (the build job above already validates a real build).
      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tag-major:
    name: Move major tag
    needs: build
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Repoint major tag to this release
        shell: bash
        run: |
          major="${GITHUB_REF_NAME%%.*}" # v0.1.0 -> v0
          git tag -f "$major" # points at the checked-out tag commit (HEAD)
          git push -f origin "$major"
